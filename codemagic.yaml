workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
    scripts:
      - name: Prepare environment and keystore
        script: |
          cp -n .env.example .env || true
          if [ -f debug.keystore.base64 ]; then
            base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew
      - name: Build Android Debug APK
        script: ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - balopezg01@liverpool.com.mx
        notify:
          failure: true
          success: true
